<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Document navigation</title>
<style>
  body { margin: 0; }
  body::before { content: ''; display: block; height: 131px; }
  .lumen-doc-layout { display: grid; grid-template-columns: 250px 1fr; align-items: start; }
  .lumen-doc-sidebar { position: sticky; top: 76px; height: calc(100vh - 76px); overflow: auto; border: 2px solid; }
