# Test infrastructure with non-default ports to avoid collisions with local services.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   pnpm test
#   docker compose -f docker-compose.test.yml down -v
#
# Override ports via environment:
#   TEST_REDIS_PORT=26379 TEST_POSTGRES_PORT=25432 docker compose -f docker-compose.test.yml up -d
#
# Every port is published on the loopback only. A bare "15432:5432" publishes
# on 0.0.0.0, and docker's own forwarding sits in front of the host firewall:
# the LAN reaches it whatever the firewall says. Measured in daos on
# 2026-09-16 — its test Postgres answered a login from another address on the
# network with the credentials written in its compose file — and this file's
# Postgres (test/test) was published the same way until 2026-09-29.
# `scripts/a-port-the-network-could-reach.mjs` keeps it so.

services:
  redis-test:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-16379}:6379"
    command: redis-server --save "" --appendonly no --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
    tmpfs:
      - /data

  postgres-test:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    command: >
      postgres
        -c shared_buffers=128MB
        -c max_connections=50
        -c fsync=off
        -c synchronous_commit=off
        -c full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 2s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
