name: Qualify a managed backend handoff
run-name: Handoff ${{ inputs.previous }} → ${{ inputs.candidate }}

on:
  workflow_dispatch:
    inputs:
      previous:
        description: Full commit of the independently supervised backend currently serving
        required: true
      candidate:
        description: Full commit proposed for the fleet
        required: true
      node:
        description: Exact Node version on the target
        required: true
        default: '22.23.4'

permissions:
  contents: read

jobs:
  systemd:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: isolated-ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 12
    env:
      PREVIOUS: ${{ inputs.previous }}
      CANDIDATE: ${{ inputs.candidate }}
      TARGET_NODE: ${{ inputs.node }}
      TZ: UTC
      TURBO_TELEMETRY_DISABLED: '1'
      TURBO_FORCE: 'true'
      TURBO_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify both revisions belong to the reviewed main history
        run: |
          [[ "$PREVIOUS" =~ ^[a-f0-9]{40}$ && "$CANDIDATE" =~ ^[a-f0-9]{40}$ && "$PREVIOUS" != "$CANDIDATE" ]]
          [[ "$TARGET_NODE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$PREVIOUS" HEAD
          git merge-base --is-ancestor "$CANDIDATE" HEAD
          test "$(ps -o comm= -p 1)" = systemd
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node }}
      - name: Build both sealed runtimes from their own frozen workspaces
        run: |
          test "$(node -p 'process.versions.node')" = "$TARGET_NODE"
          for rev in "$PREVIOUS" "$CANDIDATE"; do
            tree="$RUNNER_TEMP/source-$rev"
            runtime="$RUNNER_TEMP/omnitron-handoff-$rev"
            git worktree add --detach "$tree" "$rev"
            (
              cd "$tree"
              SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
              export SOURCE_DATE_EPOCH
              pnpm install --frozen-lockfile
              pnpm run build
              node apps/omnitron/scripts/freeze-backend.mjs apps/omnitron "$runtime"
              node --input-type=module - "$runtime" "$rev" <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const [, , root, commit] = process.argv;
          const stamp = JSON.parse(readFileSync(root + '/packages/0/dist/BUILD.json'));
          assert.equal(stamp.commit, commit);
          assert.equal(stamp.dirty, false);
          JS
            )
          done
      - name: Verify fresh and previous-version migration journals through the sealed CLIs
        env:
          TEST_DATABASE_URL: postgresql://postgres:isolated-ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: >-
          node apps/omnitron/test/runtime/fresh-migration-history.mjs
          "$RUNNER_TEMP/omnitron-handoff-$CANDIDATE/packages/0/dist"
          "$RUNNER_TEMP/omnitron-handoff-$PREVIOUS/packages/0/dist"
      - name: Start the installed CLI in background and foreground and shut down through RPC
        env:
          TEST_DATABASE_URL: postgresql://postgres:isolated-ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: |
          # The runner is itself a service. Exercise an interactive CLI in a
          # separate native scope; removing its service environment alone
          # would leave detached children inside the runner's kill group.
          for role in slave master; do
            scope="omnitron-cli-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${role}.scope"
            args=("$RUNNER_TEMP/omnitron-handoff-$CANDIDATE/packages/0/dist")
            if [[ "$role" == master ]]; then args+=(--master); fi
            sudo systemd-run --scope --quiet --unit="$scope" \
              --property=RuntimeMaxSec=8min --property=MemoryMax=2G --property=TasksMax=256 \
              /usr/bin/env -i PATH="$PATH" HOME="$RUNNER_TEMP" TZ=UTC \
              TEST_DATABASE_URL="$TEST_DATABASE_URL" OMNITRON_TEST_SCOPE="$scope" \
              "$(command -v node)" apps/omnitron/test/runtime/runtime-startup.mjs "${args[@]}"
          done
      - name: Upgrade and roll back a development SDK through one resident candidate owner
        run: |
          node apps/omnitron/test/runtime/development-watch.mjs \
            "$RUNNER_TEMP/omnitron-handoff-$CANDIDATE/packages/0/dist" \
            --application-sdk "$RUNNER_TEMP/omnitron-handoff-$PREVIOUS/packages/0" \
            --next-application-sdk "$RUNNER_TEMP/omnitron-handoff-$CANDIDATE/packages/0"
      - name: Deliver an application on its own SDK through the previous execution owner
        run: |
          node apps/omnitron/test/runtime/installed-runtime-context.mjs \
            "$RUNNER_TEMP/omnitron-handoff-$CANDIDATE/packages/0/dist" \
            "$RUNNER_TEMP/omnitron-handoff-$PREVIOUS/packages/0/dist" \
            "$RUNNER_TEMP/source-$CANDIDATE" \
            "--application-dist=$RUNNER_TEMP/source-$CANDIDATE/apps/omnitron/dist"
      - name: Recover, update and roll back while a supervised application serves requests
        run: |
          stage=/opt/omnitron-handoff-qualification
          sudo install -d -m 0700 "$stage"
          for rev in "$PREVIOUS" "$CANDIDATE"; do
            sudo cp -a --no-preserve=ownership "$RUNNER_TEMP/omnitron-handoff-$rev" "$stage/$rev"
          done
          sudo -- "$(command -v node)" apps/omnitron/test/runtime/managed-backend.mjs \
            "$stage/$PREVIOUS/packages/0/dist" "$stage/$CANDIDATE/packages/0/dist"
      - name: Replace and roll back the execution owner with reviewed stack stops
        run: |
          stage=/opt/omnitron-handoff-qualification
          sudo -- "$(command -v node)" apps/omnitron/test/runtime/managed-backend.mjs \
            "$stage/$PREVIOUS/packages/0/dist" "$stage/$CANDIDATE/packages/0/dist" \
            --owner-roundtrip
