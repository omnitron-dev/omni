name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  # -------------------------------------------------------------------
  # Fast-fail layer. Every package declares `typecheck`, so `-r` covers
  # the whole workspace without a list here that would drift from it.
  #
  # Lint runs independently, one workspace at a time to bound runner memory.
  # -------------------------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: isolated-ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Resolve pnpm from the repository's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages and applications
        run: pnpm build
      - name: Rebuild and compare two independent release archives
        working-directory: apps/omnitron
        run: node test/runtime/reproducible-bundle.mjs dist
      - name: Verify offline application delivery and owner-bound launch receipts
        working-directory: apps/omnitron
        run: |
          node test/runtime/application-closure.mjs dist
          node test/runtime/release-provenance.mjs dist
          node test/runtime/execution-host.mjs dist
      - name: Linked and npm framework builds and recipient admission
        working-directory: apps/omnitron
        run: >-
          pnpm exec vitest run --maxWorkers 2
          test/unit/registry-framework-release.test.ts
          test/unit/a-release-built-against-the-developers-omni.test.ts
          test/unit/a-release-the-node-never-ran.test.ts
          test/unit/installed-release.test.ts
      - name: Managed fleet distribution, handoff and reconciliation
        working-directory: apps/omnitron
        run: |
          node test/runtime/kernel-distribution.mjs dist
          pnpm exec vitest run --maxWorkers 2 test/unit/kernel-catalog.test.ts test/unit/kernel-rollout.test.ts test/unit/managed-rollout-driver.test.ts test/unit/managed-fleet-rollout-cli.test.ts test/unit/supervisor-transition.test.ts
      - name: Verify package archive exports and install the packed CLI
        run: node scripts/check-package-exports.mjs --install-consumer "$RUNNER_TEMP/omnitron-npm-consumer"
      - name: Exercise the packaged CLI and SQLite at the Node runtime boundaries
        run: |
          npx --yes --package=node@22.14.0 -- node scripts/ci/check-runtime-consumer.mjs "$RUNNER_TEMP/omnitron-npm-consumer"
          npx --yes --package=node@23.6.0 -- node scripts/ci/check-runtime-consumer.mjs "$RUNNER_TEMP/omnitron-npm-consumer"
          npx --yes --package=node@22.12.0 -- node scripts/ci/check-runtime-consumer.mjs "$RUNNER_TEMP/omnitron-npm-consumer" --expect-unsupported
      - name: Rehearse package publication against a loopback registry
        run: node --test scripts/ci/release.test.mjs
      - name: Console publication and recovery
        run: node --test apps/omnitron/scripts/console-publication.test.mjs
      - name: Verify both sides of the authenticated control-plane RPC boundary
        working-directory: apps/omnitron
        run: >-
          pnpm exec vitest run --maxWorkers 2
          test/unit/rpc-authorization.test.ts
          test/unit/a-master-could-tell-a-node-and-not-ask-it.test.ts
          test/unit/local-node-daemon-readers.test.ts
      - name: SQLite permissions preserve concurrent storage
        run: pnpm --filter @omnitron-dev/omnitron test:private-storage
      - name: Cluster takeover, installed application recovery and recipient authority
        working-directory: apps/omnitron
        env:
          TEST_DATABASE_URL: postgresql://postgres:isolated-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
        run: >-
          pnpm exec vitest run --maxWorkers 2
          test/integration/a-cluster-that-could-elect-nobody.test.ts
          test/integration/daemon-session-authority.test.ts
          test/integration/mesh-source-authority.test.ts
          test/integration/replication-reconciliation.test.ts
          test/unit/mesh-recovery.test.ts
          test/unit/a-mesh-that-connected-only-where-something-was-deployed.test.ts
          test/unit/ssh-host-trust.test.ts
          test/unit/node-registry-writes.test.ts
          test/unit/sync-delivery.test.ts
          test/integration/installed-stack-recovery.test.ts
          test/unit/stack-effect-authority.test.ts
          test/unit/installed-stack-owner.test.ts
          test/unit/installed-stack-resume.test.ts
          test/unit/installed-stack-resume-cli.test.ts
          test/unit/infra-mutation-authority.test.ts
          test/unit/standalone-infrastructure.test.ts
          test/unit/workspace-migration-plan.test.ts
      - name: Stack startup and schema continuity
        run: pnpm --filter @omnitron-dev/omnitron exec vitest run test/unit/a-master-that-stood-still-while-it-migrated.test.ts test/unit/project-service-internals.spec.ts test/unit/wait-for-postgres-errors.test.ts test/unit/schema-transition.test.ts test/unit/schema-compatibility.test.ts
      - name: RPC role boundaries
        run: pnpm --filter @omnitron-dev/omnitron exec vitest run test/integration/trace-authorization.test.ts test/integration/daemon-health-authorization.test.ts test/unit/rpc-authorization.test.ts test/unit/daemon-role-policy.test.ts
      - name: Relay confirmation and persistent application logs
        run: |
          pnpm --filter @omnitron-dev/titan-telemetry-relay test
          pnpm --filter @omnitron-dev/omnitron exec vitest run test/unit/logging-delivery.test.ts
      - name: Deployment progress across RPC, CLI and Console
        run: |
          pnpm --filter @omnitron-dev/omnitron exec vitest run --maxWorkers 2 test/unit/remote-deployer-probe.test.ts test/unit/stack-progress-cli.test.ts test/webapp
          pnpm --filter @omnitron-dev/prism exec vitest run src/blocks/auth-block/role-guard-revocation.test.tsx src/theme/__tests__/component-style-composition.test.tsx src/components/admin-filters/filter-toolbar.test.tsx
      - name: Console chart loading and topology in Chromium
        working-directory: apps/omnitron/webapp
        run: |
          node --test test/chart-loading.test.mjs
          pnpm exec playwright install --with-deps --only-shell chromium
          pnpm run test:browser
      - name: Isolated test orchestration
        run: node --test scripts/ci/workspace-test.test.mjs
      - name: Pure access policy and browser bundle boundary
        run: |
          pnpm --filter @omnitron-dev/access test
          pnpm --filter @omnitron-dev/access check:bundle
      - name: Typecheck (all packages + apps)
        run: pnpm -r run typecheck

  lint:
    name: Workspace lint
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Lint every workspace
        run: |
          for dir in apps/* packages/*; do
            pnpm exec eslint --max-warnings=0 --no-error-on-unmatched-pattern "$dir/**/*.{js,jsx,ts,tsx}"
          done

  reproducible-backend:
    name: Reproduce the full backend and Console
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-reproducible-backend.mjs

  # -------------------------------------------------------------------
  # Standing checks — the scanners in `scripts/`.
  #
  # Safe to gate on, measured rather than assumed: `run-checks.mjs` exits
  # non-zero for a failing GATE only. A worklist is a standing backlog,
  # counted and printed, never red — so this job does not go permanently
  # amber and teach everyone to ignore it. A manifest naming a file that
  # no longer exists exits 2 rather than skipping silently, because
  # otherwise a rename removes a check without a word.
  #
  # No scanner imports a workspace package, so this installs without
  # building them.
  # -------------------------------------------------------------------
  scans:
    name: Standing checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit locked dependencies (including build tools and Console)
        run: pnpm audit --audit-level low
      - name: Standing checks (gates must pass; worklists are printed)
        run: pnpm check:scans
