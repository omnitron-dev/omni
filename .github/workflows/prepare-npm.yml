name: Prepare npm archives
run-name: npm ${{ inputs.version }} at ${{ inputs.commit }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Committed npm package version
        required: true
      commit:
        description: Exact version commit on main
        required: true
permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the committed source
        run: |
          test "$COMMIT" = "$GITHUB_SHA"
          test "$COMMIT" = "$(git rev-parse HEAD)"
          test "$VERSION" = "$(node -p "require('./apps/omnitron/package.json').version")"
          git config user.name "Omnitron release preparation"
          git config user.email "release@localhost"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - run: pnpm install --frozen-lockfile
      - name: Build and verify all three npm consumers
        run: |
          pnpm exec xec release "$VERSION" --prepare
          test "$COMMIT" = "$(git rev-parse HEAD)"
          batch=".release-artifacts/$VERSION/$COMMIT"
          cp ".release-artifacts/qualification/$COMMIT/preparation/PREPARATION.json" "$batch/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ inputs.version }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .release-artifacts/${{ inputs.version }}/${{ github.sha }}/*.tgz
            .release-artifacts/${{ inputs.version }}/${{ github.sha }}/producer.json
            .release-artifacts/${{ inputs.version }}/${{ github.sha }}/release.json
            .release-artifacts/${{ inputs.version }}/${{ github.sha }}/PREPARATION.json
            .release-artifacts/${{ inputs.version }}/${{ github.sha }}/NOTES.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
